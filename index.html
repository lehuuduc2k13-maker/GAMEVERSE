<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>GAMEVERSE V3</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="app"></div>

<div id="toast-container"></div>

<!-- RUNTIME -->
<div id="runtime" class="runtime hidden">
    <canvas id="gameCanvas"></canvas>

    <div class="runtime-top">
        <div class="runtime-title">
            <b id="runtime-title">GAME</b>
            <span id="runtime-status">ONLINE</span>
        </div>

        <button class="danger-btn" onclick="Runtime.exit()">
            EXIT
        </button>
    </div>

    <div class="runtime-hud">
        <div class="hud-card">
            <b id="hud-realm">Luyện Khí</b>

            <div class="bar">
                <i id="hud-hp"></i>
            </div>

            <div class="bar qi">
                <i id="hud-qi"></i>
            </div>

            <small>
                Lv.<span id="hud-level">1</span>
                • XP <span id="hud-xp">0</span>/100
            </small>
        </div>
    </div>

    <div class="runtime-actions">
        <button onclick="Runtime.attack()">⚔</button>
        <button onclick="Runtime.absorb()">✨</button>
        <button onclick="Runtime.meditate()">🧘</button>
    </div>

    <div class="mobile-controls">
        <button data-key="w">▲</button>
        <div>
            <button data-key="a">◀</button>
            <button data-key="s">▼</button>
            <button data-key="d">▶</button>
        </div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
