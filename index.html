/* ============================================================
   STORAGE
============================================================ */

function clone(obj){
    return JSON.parse(JSON.stringify(obj));
}

function loadDB(){
    try{
        const raw = localStorage.getItem(DB_KEY);

        if(!raw){
            return clone(DEFAULT_DB);
        }

        const parsed = JSON.parse(raw);

        return merge(clone(DEFAULT_DB),parsed);
    }catch(e){
        console.warn(e);
        return clone(DEFAULT_DB);
    }
}

function merge(base,extra){
    if(!extra || typeof extra!=="object"){
        return base;
    }

    Object.keys(extra).forEach(key=>{
        if(
            extra[key] &&
            typeof extra[key]==="object" &&
            !Array.isArray(extra[key]) &&
            base[key] &&
            typeof base[key]==="object" &&
            !Array.isArray(base[key])
        ){
            base[key]=merge(base[key],extra[key]);
        }else{
            base[key]=extra[key];
        }
    });

    return base;
}

let DB=loadDB();

function saveDB(){
    localStorage.setItem(DB_KEY,JSON.stringify(DB));

function uid(prefix="id"){

function toast(message,type="info"){
    const box=document.getElementById("toastBox");

    const el=document.createElement("div");

    el.className=
        "toast glass glow rounded-xl px-4 py-3 text-sm min-w-[240px]";

    el.innerHTML=`
        <div class="font-semibold">${escapeHTML(message)}</div>
    `;

    box.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },2600);
}

function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function clamp(n,min,max){
    return Math.max(min,Math.min(max,n));
}


/* ============================================================
   AI GAME ARCHITECT V3
============================================================ */

function analyzePrompt(prompt){

    const p=prompt.toLowerCase();

    const systems=[];

    if(/3d|3d open world|thế giới mở/.test(p))
        systems.push("3D World");

    if(/rpg|tu tiên|level|cấp độ|cultivation/.test(p))
        systems.push("RPG Progression");

    if(/combat|đánh|chiến đấu|kiếm|súng/.test(p))
        systems.push("Combat");

    if(/npc|nhân vật|đối thoại/.test(p))
        systems.push("NPC & Dialogue");

    if(/quest|nhiệm vụ/.test(p))
        systems.push("Quest System");

    if(/inventory|túi đồ|item|vật phẩm/.test(p))
        systems.push("Inventory");

    if(/craft|chế tạo/.test(p))
        systems.push("Crafting");

    if(/shop|cửa hàng|mua|bán/.test(p))
        systems.push("Shop");

    if(/weather|thời tiết|mưa|tuyết/.test(p))
        systems.push("Weather");

    if(/day|night|ngày|đêm/.test(p))
        systems.push("Day/Night");

    if(/multiplayer|online|nhiều người/.test(p))
        systems.push("Multiplayer Architecture");

    if(/mobile|điện thoại|android|ios/.test(p))
        systems.push("Mobile Controls");

    if(/save|lưu|database/.test(p))
        systems.push("Save System");

    if(!systems.length){
        systems.push(
            "Core Gameplay",
            "Progression",
            "Save System",
            "Mobile Support"
        );
    }

    let score=70;

    score+=Math.min(18,systems.length*2);

    if(p.length>100) score+=4;
    if(/3d/.test(p)) score+=3;
    if(/multiplayer/.test(p)) score+=2;

    score=clamp(score,0,100);

    let tier="C";

    if(score>=95) tier="S+";
    else if(score>=90) tier="S";
    else if(score>=82) tier="A";
    else if(score>=72) tier="B";

    const shareIndex=clamp(
        Math.round(score*.72 + systems.length*2.2),
        0,
        100
    );

    return {
        title:generateTitle(prompt),
        prompt,
        genre:detectGenre(p),
        platform:["PC","Android","iOS"],
        systems,
        score,
        tier,
        shareIndex,
        world:{
            type:/3d/.test(p)?"3D":"2D",
            openWorld:/open world|thế giới mở/.test(p),
            multiplayer:/multiplayer|online|nhiều người/.test(p)
        },

        gameplay:{
            combat:/combat|đánh|chiến đấu|kiếm|súng/.test(p),
            progression:/rpg|level|cấp độ|tu tiên/.test(p),
            quests:/quest|nhiệm vụ/.test(p),
            inventory:/inventory|túi đồ|item|vật phẩm/.test(p),
            crafting:/craft|chế tạo/.test(p),
            shop:/shop|cửa hàng/.test(p)
        }
    };
}

function detectGenre(p){

    if(/tu tiên|xianxia|cultivation/.test(p))
        return "Xianxia RPG";

    if(/rpg/.test(p))
        return "RPG";

    if(/survival|sinh tồn/.test(p))
        return "Survival";

    if(/racing|đua xe/.test(p))
        return "Racing";

    if(/horror|kinh dị/.test(p))
        return "Horror";

    if(/strategy|chiến thuật/.test(p))
        return "Strategy";

    if(/shooter|súng/.test(p))
        return "Shooter";

    return "Adventure";
}

function generateTitle(prompt){

    const p=prompt.toLowerCase();

    if(/tu tiên|xianxia|cultivation/.test(p))
        return "Tiên Đạo Vô Tận";

    if(/zombie|xác sống/.test(p))
        return "Zombie Last Stand";

    if(/racing|đua xe/.test(p))
        return "Velocity Legends";

    if(/space|vũ trụ/.test(p))
        return "Galaxy Frontier";

    return "AI Generated World";
}

    if(!p)return;

    const prompt=promptEdit(
        "AI EDIT — mô tả thay đổi muốn thực hiện:",
        p.description
    );

    if(prompt===null)return;

    p.description=prompt;

    const spec=analyzePrompt(prompt);

    p.spec=spec;

    p.activeVersion++;

    p.versions.push({
        version:p.activeVersion,
        createdAt:Date.now(),
        spec:clone(spec)
    });

    p.updatedAt=Date.now();

    saveDB();

    toast("Project đã được AI update");

    render();

function promptEdit(title,defaultValue){

function publishProject(id){

    const p=DB.projects.find(x=>x.id===id);

    if(!p)return;

    let game=DB.games.find(g=>g.projectId===id);

    if(!game){

        game={
            id:uid("game"),
            projectId:id,
            title:p.title,
            creator:p.creator,
            category:p.category,
            players:0,
            likes:0,

            index:p.spec.shareIndex,
            description:p.description,
            color:"from-indigo-700 to-purple-900",

function trade(gameId,type){

    const game=DB.games.find(g=>g.id===gameId);

    if(!game?.stock)return;

    const amountRaw=prompt(
        `${type==="buy"?"Mua":"Bán"} ${game.stock.symbol}\nNhập số lượng:`,
        "1"
    );

    if(amountRaw===null)return;

    const amount=parseInt(amountRaw);

    if(!Number.isFinite(amount)||amount<=0){
        toast("Số lượng không hợp lệ");
        return;
    }

    const symbol=game.stock.symbol;
    const price=game.stock.price*amount;

    DB.portfolio[symbol] ??=0;

    if(type==="buy"){

        if(DB.user.coin<price){
            toast("Không đủ Coin");
            return;
        }

        DB.user.coin-=price;
        DB.portfolio[symbol]+=amount;

        game.stock.volume+=price;

        toast(`Đã mua ${amount} ${symbol}`);

    }else{

        if(DB.portfolio[symbol]<amount){
            toast("Không đủ tài sản để bán");
            return;
        }

        DB.portfolio[symbol]-=amount;
        DB.user.coin+=price;

        game.stock.volume+=price;

        toast(`Đã bán ${amount} ${symbol}`);
    }

    saveDB();

    render();
}

function startRuntime(){

    const canvas=document.getElementById("runtimeCanvas");

    if(!canvas)return;

    runtime={
        scene:new THREE.Scene(),
        camera:new THREE.PerspectiveCamera(
            65,
            window.innerWidth/window.innerHeight,
            .1,
            1000
        ),
        renderer:new THREE.WebGLRenderer({
            canvas,
            antialias:true
        }),
        player:null,
        enemies:[],
        stones:[],
        keys:{},
        clock:new THREE.Clock(),
        meditation:DB.runtime.meditation
    };

    runtime.renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    runtime.renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,1.7)
    );

    runtime.scene.background=new THREE.Color(0x071020);


    /* LIGHT */

    const ambient=new THREE.AmbientLight(
        0xffffff,
        .65
    );

    runtime.scene.add(ambient);

    const sun=new THREE.DirectionalLight(
        0xffffff,
        1
    );

    sun.position.set(20,30,10);

    runtime.scene.add(sun);


    /* GROUND */

    const ground=new THREE.Mesh(
        new THREE.PlaneGeometry(300,300),
        new THREE.MeshStandardMaterial({
            color:0x17241c
        })
    );

    ground.rotation.x=-Math.PI/2;

    runtime.scene.add(ground);


    /* GRID */

    const grid=new THREE.GridHelper(
        300,
        60,
        0x2a4260,
        0x18283c
    );

    runtime.scene.add(grid);


    /* PLAYER */

    const group=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.CylinderGeometry(.55,.7,1.7,16),
        new THREE.MeshStandardMaterial({
            color:0x5865ff
        })
    );

    body.position.y=.9;

    group.add(body);


    const head=new THREE.Mesh(
        new THREE.SphereGeometry(.43,16,16),
        new THREE.MeshStandardMaterial({
            color:0xffd0ad
        })
    );

    head.position.y=2;

    group.add(head);

    group.position.set(0,0,0);

    runtime.player=group;

    runtime.scene.add(group);


    /* STONES */

    for(let i=0;i<18;i++){

        const stone=new THREE.Mesh(
            new THREE.OctahedronGeometry(.35),
            new THREE.MeshStandardMaterial({
                color:0x55dfff,
                emissive:0x114455
            })
        );

        stone.position.set(
            (Math.random()-.5)*80,
            .35,
            (Math.random()-.5)*80
        );

        runtime.scene.add(stone);

        runtime.stones.push(stone);
    }


    /* ENEMIES */

    for(let i=0;i<8;i++){

        const enemy=new THREE.Mesh(
            new THREE.BoxGeometry(1.2,1.8,1.2),
            new THREE.MeshStandardMaterial({
                color:0xb43f58
            })
        );

        enemy.position.set(
            (Math.random()-.5)*60,
            .9,
            (Math.random()-.5)*60
        );

        runtime.scene.add(enemy);

        runtime.enemies.push(enemy);
    }


    runtime.camera.position.set(
        0,6,10
    );

    runtime.camera.lookAt(
        runtime.player.position
    );


    window.addEventListener(
        "keydown",
        runtimeKeyDown
    );

    window.addEventListener(
        "keyup",
        runtimeKeyUp
    );

    window.addEventListener(
        "resize",
        runtimeResize
    );

    animateRuntime();
}

function runtimeKeyDown(e){

    if(!runtime)return;

    runtime.keys[e.key.toLowerCase()]=true;

    if(e.key===" "){
        runtimeAttack();
    }
}

function runtimeKeyUp(e){

    if(!runtime)return;

    runtime.keys[e.key.toLowerCase()]=false;
}

function runtimeResize(){

    if(!runtime)return;

    runtime.camera.aspect=
        window.innerWidth/window.innerHeight;

    runtime.camera.updateProjectionMatrix();

    runtime.renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

function animateRuntime(){

    if(!runtime)return;

    animationID=requestAnimationFrame(
        animateRuntime
    );

    const delta=Math.min(
        runtime.clock.getDelta(),
        .05
    );

    const player=runtime.player;

    if(!DB.runtime.meditation){

        const speed=8*delta;

        if(runtime.keys.w)
            player.position.z-=speed;

        if(runtime.keys.s)
            player.position.z+=speed;

        if(runtime.keys.a)
            player.position.x-=speed;

        if(runtime.keys.d)
            player.position.x+=speed;
    }


    /* ENEMY AI */

    runtime.enemies.forEach(enemy=>{

        const dx=
            player.position.x-enemy.position.x;

        const dz=
            player.position.z-enemy.position.z;

        const distance=Math.sqrt(
            dx*dx+dz*dz
        );

        if(distance>2 && distance<35){

            enemy.position.x +=
                dx/distance*delta*1.5;

            enemy.position.z +=
                dz/distance*delta*1.5;
        }

    });


    /* CAMERA */

    runtime.camera.position.x=
        player.position.x;

    runtime.camera.position.z=
        player.position.z+10;

    runtime.camera.lookAt(
        player.position.x,
        1,
        player.position.z
    );


    runtime.renderer.render(
        runtime.scene,
        runtime.camera
    );
}


/* ============================================================
   RUNTIME ACTIONS
============================================================ */

function runtimeAttack(){

    if(!runtime)return;

    if(DB.runtime.meditation){
        toast("Đang thiền — hãy Đứng dậy trước");
        return;
    }

    let closest=null;
    let distance=999;

    runtime.enemies.forEach(enemy=>{

        const d=enemy.position.distanceTo(
            runtime.player.position
        );

        if(d<distance){
            distance=d;
            closest=enemy;
        }

    });

    if(closest && distance<4){

        runtime.scene.remove(closest);

        runtime.enemies=
            runtime.enemies.filter(x=>x!==closest);

        gainXP(25);

        toast("⚔ Đánh bại quái vật +25 XP");

    }else{

        toast("Không có mục tiêu gần");
    }
}

function runtimeAbsorb(){

    if(!runtime)return;

    if(DB.runtime.meditation){
        toast("Đang thiền");
        return;
    }

    let closest=null;
    let distance=3;

    runtime.stones.forEach(stone=>{

        const d=stone.position.distanceTo(
            runtime.player.position
        );

        if(d<distance){
            distance=d;
            closest=stone;
        }

    });

    if(closest){

        runtime.scene.remove(closest);

        runtime.stones=
            runtime.stones.filter(x=>x!==closest);

        DB.runtime.stones++;
        DB.runtime.qi=clamp(
            DB.runtime.qi+12,
            0,
            100
        );

        DB.runtime.inventory["Linh Thạch"]++;

        gainXP(10);

        saveDB();

        updateRuntimeHUD();

        toast("✨ Hấp thụ linh thạch +10 XP");

    }else{

        toast("Không có linh thạch gần đây");
    }
}

function toggleMeditation(){

    DB.runtime.meditation=
        !DB.runtime.meditation;

    if(DB.runtime.meditation){

        toast("🧘 Đã ngồi thiền — nhân vật sẽ không tự đứng dậy");

    }else{

        toast("🧘 Đứng dậy");

    }

    saveDB();
}

function gainXP(amount){

    DB.runtime.xp+=amount;

    while(DB.runtime.xp>=100){

        DB.runtime.xp-=100;

        DB.runtime.level++;

        const realmIndex=
            clamp(
                Math.floor(
                    (DB.runtime.level-1)/10
                ),
                0,
                REALMS.length-1
            );

        DB.runtime.realm=
            REALMS[realmIndex];

        DB.runtime.qi=100;
        DB.runtime.hp=100;

        toast(
            `🔥 Level Up! ${DB.runtime.realm}`
        );
    }

    saveDB();

    updateRuntimeHUD();
}

function updateRuntimeHUD(){

    const hp=document.getElementById("hpBar");
    const qi=document.getElementById("qiBar");

    if(hp)
        hp.style.width=
            `${DB.runtime.hp}%`;

    if(qi)
        qi.style.width=
            `${DB.runtime.qi}%`;
}

function closeRuntime(){

    cancelAnimationFrame(animationID);

    window.removeEventListener(
        "keydown",
        runtimeKeyDown
    );

    window.removeEventListener(
        "keyup",
        runtimeKeyUp
    );

    window.removeEventListener(
        "resize",
        runtimeResize
    );

    runtime=null;

    document.getElementById(
        "runtimeOverlay"
    )?.remove();

    saveDB();
}


/* ============================================================
   SECTION ROUTER
============================================================ */

function renderSection(section){

    switch(section){

        case "builder":
            return renderBuilder();

        case "projects":
            return renderProjects();

        case "market":
            return renderMarket();

        case "analytics":
            return renderAnalytics();

        case "discover":
        default:
            return renderDiscover();
    }
}


/* ============================================================
   BOOT
============================================================ */

updateCreatorLevel();

saveDB();

render();

</script>
